<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <!-- The one GA4 install on this site — nothing in the React code adds it
         again, which would count every visit twice. The ID is mirrored in
         api/dashboard.ts (MEASUREMENT_ID) for the dashboard's Connections
         panel; change both together.
         The config call is skipped on /dashboard, so reading the traffic is
         not itself recorded as traffic, and on localhost, so local work does
         not show up as visits. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SPWN0F006E"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      if (
        !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) &&
        !/^\/dashboard(\/|$)/.test(location.pathname)
      ) {
        gtag('config', 'G-SPWN0F006E');
      }
    </script>
    <meta charset="UTF-8" />
    <!-- Crawlers render without scrolling, so scroll-triggered fade-ins would
         leave most of each page invisible to them. Flag them here, before
         anything paints; the matching rule is "Crawler-safe scroll reveals"
         in src/index.css. -->
    <script>
      if (navigator.webdriver || /bot|crawl|spider|slurp|screaming frog|lighthouse|headlesschrome|inspectiontool|bingpreview|facebookexternalhit/i.test(navigator.userAgent)) {
        document.documentElement.classList.add('no-reveal');
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Sienna accessibility widget. It lives in the app shell rather than in a
         React component on purpose: this is a single-page app, so index.html is
         loaded once and the widget survives every client-side route change.
         Mounted from a component it would be torn down and rebuilt on each
         navigation, losing whatever settings the visitor had chosen. -->
